name: Build - Windows x64 (manual)

# Fork-only build workflow: run manually on any chosen branch.
# No automatic builds, tags, or GitHub Releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # Stable SemVer with a unique workflow-run identifier, not camera-specific.
      BT_VERSION: 1.0.0+fork.${{ github.run_number }}
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply project dependency patches
        run: python tools/setup_deps.py

      - name: Verify dependency patches
        run: python tools/setup_deps.py --check

      - name: Verify clang-cl version
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $clangPath = if ($clang) { $clang.Source } else { $null }
          if (-not $clangPath) {
            foreach ($p in @("$env:ProgramFiles\LLVM\bin\clang-cl.exe",
                             "${env:ProgramFiles(x86)}\LLVM\bin\clang-cl.exe")) {
              if (Test-Path $p) { $clangPath = $p; break }
            }
          }
          if (-not $clangPath) { throw 'clang-cl.exe not found' }
          $dir = Split-Path $clangPath -Parent
          Add-Content $env:GITHUB_PATH $dir
          $version = & $clangPath --version | Select-Object -First 1
          Write-Host $version
          if ($version -notmatch 'version (\d+)' -or [int]$Matches[1] -lt 19) {
            throw "LLVM 19 or newer required: $version"
          }

      - name: Configure
        run: cmd /c cmake_configure.bat

      - name: Build
        run: cmd /c build_bt.bat

      - name: Verify native camera hooks
        run: python tools/tests/test_camera_hooks.py

      - name: Test neutral camera behavior and live speed changes
        run: cmd /c "build_bt.bat TooieCameraSettingsTests && build-cmake\TooieCameraSettingsTests.exe"

      - name: Verify Breegull native TOML hooks
        run: python tools/tests/test_breegull_hooks.py

      - name: Test Breegull N64 input translation
        run: cmd /c "build_bt.bat TooieBreegullControlsTests && build-cmake\TooieBreegullControlsTests.exe"

      - name: Verify executable and package inputs
        shell: pwsh
        run: |
          $exe = 'build-cmake/BanjoTooieRecompiled.exe'
          if (-not (Test-Path $exe)) { throw 'Windows executable missing' }
          $b = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($machine -ne 0x8664) { throw "Unexpected PE architecture: $machine" }
          if ($subsystem -ne 2) { throw "Unexpected PE subsystem: $subsystem" }
          if (-not ([Text.Encoding]::ASCII.GetString($b)).Contains($env:BT_VERSION)) {
            throw "Build version '$env:BT_VERSION' is not embedded in the executable"
          }
          foreach ($f in @('build-cmake/SDL2.dll',
                           'build-cmake/dxcompiler.dll',
                           'build-cmake/dxil.dll',
                           'build-cmake/assets/recomp.rcss')) {
            if (-not (Test-Path $f)) { throw "Missing file: $f" }
          }
          Write-Host 'Windows PE x64 GUI executable and runtime files present'

      - name: Determine branch-specific package name
        id: package_name
        shell: pwsh
        run: |
          # Branches may include '/', which is unsafe in artifact/ZIP names.
          $safe = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          if (-not $safe) { throw 'Cannot determine branch for artifact name' }
          "basename=BanjoTooieRecompiled-$safe-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Package Windows build
        shell: pwsh
        run: |
          $stage = 'package/BanjoTooieRecompiled'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build-cmake/BanjoTooieRecompiled.exe' $stage
          Copy-Item @('build-cmake/SDL2.dll',
                      'build-cmake/dxcompiler.dll',
                      'build-cmake/dxil.dll') $stage
          Copy-Item -Recurse 'build-cmake/assets' "$stage/assets"
          Copy-Item @('CAMERA_PATCH.md', 'BREEGULL_CONTROLS.md', 'BREEGULL_INPUT_TRACE.md', 'README.md', 'COPYING') $stage
          $basename = '${{ steps.package_name.outputs.basename }}'
          Compress-Archive -Path "$stage/*" -DestinationPath "package/$basename.zip" -Force
          Get-FileHash "$stage/BanjoTooieRecompiled.exe" -Algorithm SHA256 | Format-List

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_name.outputs.basename }}
          path: package/${{ steps.package_name.outputs.basename }}.zip
          retention-days: 3
          if-no-files-found: error
